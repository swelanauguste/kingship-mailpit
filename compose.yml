services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./mailpit-data:/data
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    environment:
      - MP_DATABASE=/data/mailpit.db
      - MP_MAX_MESSAGES=5000
    networks:
      proxy:
        aliases:
          - shared-mailpit

networks:
  proxy:
    external: true
    name: shared-proxy
